version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: maestro-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mattermost-network-dev

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22.3
    container_name: mattermost-temporal-dev
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=mysecretpassword
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mattermost-network-dev

  # Temporal Web UI
  temporal-web:
    image: temporalio/web:1.15.0
    container_name: mattermost-temporal-web-dev
    environment:
      - TEMPORAL_GRPC_ENDPOINT=temporal:7233
      - TEMPORAL_PERMIT_WRITE_API=true
    ports:
      - "8088:8088"
    depends_on:
      - temporal
    networks:
      - mattermost-network-dev

  # Main Application (Development mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mattermost-app-dev
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mysecretpassword
      - OPEN_API_KEY=${OPENAI_API_KEY:-dummy}
      - MATTERMOST_HOST=${MATTERMOST_HOST:-dummyHost}
      - MATTERMOST_TOKEN=${MATTERMOST_TOKEN:-dummyToken}
      - TEMPORAL_SERVICE_ADDRESS=temporal:7233
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    volumes:
      - ./src:/app/src
      - ./target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - mattermost-network-dev
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  mattermost-network-dev:
    driver: bridge 